<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">A rotating 3D LinguaGuard logo in bright colors: a vivid cyan shield with a white speech bubble and coral checkmark, above the LinguaGuard wordmark.</h2>
<div style="display:flex;flex-direction:column;align-items:center;padding:1rem 0;">
  <div id="stage" style="width:420px;height:340px;cursor:grab;touch-action:none;"></div>
  <div style="font-size:34px;font-weight:500;letter-spacing:1px;margin-top:4px;"><span style="color:#00A8CC;">Lingua</span><span style="color:#FF5A3C;">Guard</span></div>
  <div style="font-size:13px;letter-spacing:4px;color:var(--text-muted);margin-top:6px;">LANGUAGE, PROTECTED</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var stage = document.getElementById('stage');
  var W = 420, H = 340;
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(38, W/H, 0.1, 1000);
  camera.position.set(0, 0, 340);
  var renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  var key = new THREE.DirectionalLight(0xffffff, 0.95);
  key.position.set(120, 170, 220);
  scene.add(key);
  var rim = new THREE.DirectionalLight(0x7fe8ff, 0.5);
  rim.position.set(-160, -70, -120);
  scene.add(rim);
  var fill = new THREE.DirectionalLight(0xffe0d0, 0.3);
  fill.position.set(-80, 100, 60);
  scene.add(fill);

  var group = new THREE.Group();
  scene.add(group);

  var shieldShape = new THREE.Shape();
  shieldShape.moveTo(0, 90);
  shieldShape.quadraticCurveTo(34, 78, 66, 66);
  shieldShape.lineTo(66, -4);
  shieldShape.quadraticCurveTo(66, -54, 0, -92);
  shieldShape.quadraticCurveTo(-66, -54, -66, -4);
  shieldShape.lineTo(-66, 66);
  shieldShape.quadraticCurveTo(-34, 78, 0, 90);
  shieldShape.closePath();

  var shieldGeo = new THREE.ExtrudeGeometry(shieldShape, {depth: 20, bevelEnabled: true, bevelThickness: 5, bevelSize: 5, bevelSegments: 4, curveSegments: 28});
  shieldGeo.center();
  var shield = new THREE.Mesh(shieldGeo, new THREE.MeshStandardMaterial({color: 0x00C2E0, roughness: 0.28, metalness: 0.35}));
  group.add(shield);

  var rimShape = new THREE.Shape();
  rimShape.moveTo(0, 99);
  rimShape.quadraticCurveTo(37, 86, 73, 73);
  rimShape.lineTo(73, -5);
  rimShape.quadraticCurveTo(73, -60, 0, -101);
  rimShape.quadraticCurveTo(-73, -60, -73, -5);
  rimShape.lineTo(-73, 73);
  rimShape.quadraticCurveTo(-37, 86, 0, 99);
  rimShape.closePath();
  var rimGeo = new THREE.ExtrudeGeometry(rimShape, {depth: 12, bevelEnabled: true, bevelThickness: 2, bevelSize: 2, bevelSegments: 3, curveSegments: 28});
  rimGeo.center();
  var rimMesh = new THREE.Mesh(rimGeo, new THREE.MeshStandardMaterial({color: 0x0A63E8, roughness: 0.35, metalness: 0.4}));
  rimMesh.position.z = -7;
  group.add(rimMesh);

  var ringGeo = new THREE.TorusGeometry(70, 2.2, 10, 40, Math.PI*1.98);
  var ring = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({color: 0xFFD23F, roughness: 0.3, metalness: 0.5}));
  ring.position.z = 4;
  ring.rotation.z = Math.PI/2 + 0.01;
  group.add(ring);

  var bubbleShape = new THREE.Shape();
  bubbleShape.moveTo(-30, 26);
  bubbleShape.lineTo(30, 26);
  bubbleShape.quadraticCurveTo(40, 26, 40, 16);
  bubbleShape.lineTo(40, -8);
  bubbleShape.quadraticCurveTo(40, -18, 30, -18);
  bubbleShape.lineTo(-2, -18);
  bubbleShape.lineTo(-16, -32);
  bubbleShape.lineTo(-16, -18);
  bubbleShape.lineTo(-30, -18);
  bubbleShape.quadraticCurveTo(-40, -18, -40, -8);
  bubbleShape.lineTo(-40, 16);
  bubbleShape.quadraticCurveTo(-40, 26, -30, 26);
  bubbleShape.closePath();
  var bubbleGeo = new THREE.ExtrudeGeometry(bubbleShape, {depth: 10, bevelEnabled: true, bevelThickness: 2, bevelSize: 2, bevelSegments: 3, curveSegments: 20});
  bubbleGeo.center();
  var bubble = new THREE.Mesh(bubbleGeo, new THREE.MeshStandardMaterial({color: 0xFFFFFF, roughness: 0.2, metalness: 0.05}));
  bubble.position.set(0, 6, 24);
  group.add(bubble);

  var checkPts = [new THREE.Vector3(-14, -2, 0), new THREE.Vector3(-4, -12, 0), new THREE.Vector3(16, 8, 0)];
  var checkCurve = new THREE.CatmullRomCurve3(checkPts);
  var checkGeo = new THREE.TubeGeometry(checkCurve, 20, 3.4, 14, false);
  var checkMat = new THREE.MeshStandardMaterial({color: 0xFF5A3C, roughness: 0.25, metalness: 0.3});
  var check = new THREE.Mesh(checkGeo, checkMat);
  check.position.set(0, 4, 34);
  group.add(check);
  var capGeo = new THREE.SphereGeometry(3.4, 14, 14);
  [checkPts[0], checkPts[2]].forEach(function(p){
    var cap = new THREE.Mesh(capGeo, checkMat);
    cap.position.set(p.x, p.y + 4, 34);
    group.add(cap);
  });

  var dotGeo = new THREE.SphereGeometry(3.2, 16, 16);
  var dotColors = [0xFFD23F, 0x3EE08C, 0xFFD23F];
  [-14, 0, 14].forEach(function(x, i){
    var d = new THREE.Mesh(dotGeo, new THREE.MeshStandardMaterial({color: dotColors[i], roughness: 0.3, metalness: 0.4}));
    d.position.set(x, 22, 32);
    group.add(d);
  });

  group.scale.set(1.15, 1.15, 1.15);

  var dragging = false, lastX = 0, lastY = 0, velX = 0, targetTiltX = 0.05;
  var rotY = -0.4;

  function onDown(e){ dragging = true; stage.style.cursor = 'grabbing'; lastX = e.clientX; lastY = e.clientY; }
  function onMove(e){
    if(!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    rotY += dx * 0.01;
    targetTiltX = Math.max(-0.6, Math.min(0.6, targetTiltX + dy * 0.005));
    velX = dx * 0.01;
    lastX = e.clientX; lastY = e.clientY;
  }
  function onUp(){ dragging = false; stage.style.cursor = 'grab'; }
  stage.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);

  function animate(){
    requestAnimationFrame(animate);
    if(!dragging){
      velX *= 0.95;
      rotY += 0.006 + velX;
    }
    group.rotation.y = rotY;
    group.rotation.x += (targetTiltX - group.rotation.x) * 0.08;
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
