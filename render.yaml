# Render blueprint — https://render.com/docs/blueprint-spec
#
# One web service: Express serves both the API and the built React frontend
# from a single process, so there is no separate static site to configure.
#
# Deploy: push this repo to GitHub, then in Render choose
# "New +" > "Blueprint" and point it at the repo.
services:
  - type: web
    name: linguaguard
    runtime: node
    plan: free
    # `npm ci` is the reproducible install (uses package-lock.json exactly).
    # node_modules and dist are intentionally NOT committed, so both are built
    # here on the host.
    buildCommand: npm ci && npm run build
    # Note this is NOT `npm start` — that script rebuilds on every boot, which
    # wastes time and memory on a restart. The build already happened above.
    startCommand: node server/index.js
    healthCheckPath: /api/health

    envVars:
      # ---- Set automatically ----
      # Render injects PORT itself; server/index.js reads it first.
      - key: NODE_VERSION
        value: 22
      # Wired straight from the managed Postgres defined below. This is what
      # makes data survive deploys and restarts — the whole point of moving off
      # SQLite on an ephemeral filesystem.
      - key: DATABASE_URL
        fromDatabase:
          name: linguaguard-db
          property: connectionString
      # Generated once by Render and kept stable across deploys. Rotating this
      # would invalidate every existing session and 2FA secret, since the
      # at-rest encryption key is derived from it.
      - key: JWT_SECRET
        generateValue: true

      # ---- Set these yourself in the Render dashboard ----
      # sync: false means "prompt me, don't store it in this file". Never put
      # real credentials in this repo — it is public.
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

      # M-Pesa (Safaricom Daraja)
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      # Must point at this service's own public URL once it is live, e.g.
      # https://linguaguard.onrender.com/api/mpesa/callback
      - key: MPESA_CALLBACK_URL
        sync: false

      # Telegram bot (the only platform with real content ingestion)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false

      # Email — falls back to a disposable Ethereal inbox if unset
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      # SMS / WhatsApp
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: TERMII_EMAIL_CONFIG_ID
        sync: false
      - key: TOPMESSAGE_API_KEY
        sync: false
      - key: TOPMESSAGE_SENDER_ID
        sync: false

      # OAuth — after deploying, register the redirect URIs with each provider:
      #   https://<your-service>.onrender.com/api/oauth/x/callback
      #   https://<your-service>.onrender.com/api/oauth/tiktok/callback
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false

# A managed PostgreSQL database — the durable store the app now uses. Unlike a
# disk, the free Postgres plan persists across deploys, so users, rules, and
# activity history survive. Render's free database expires after ~30 days of
# the plan and is capped at 1GB; upgrade the plan for production.
databases:
  - name: linguaguard-db
    plan: free
    databaseName: linguaguard
    user: linguaguard
